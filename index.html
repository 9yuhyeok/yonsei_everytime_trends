<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연세 에브리타임 자유게시판 키워드</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f8fc;
      --panel: #ffffff;
      --panel-2: #edf5fb;
      --text: #172b40;
      --muted: #71859a;
      --line: rgba(34, 70, 103, .14);
      --accent: #168cc7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .app { width: min(1180px, calc(100% - 32px)); height: 100dvh; margin: 0 auto; padding: clamp(16px, 3vh, 36px) 0 clamp(12px, 2vh, 28px); display: flex; flex-direction: column; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); letter-spacing: -.055em; line-height: 1; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: clamp(14px, 3vh, 28px); flex: 0 0 auto; }
    .source { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .footnote { flex: 0 0 auto; padding-top: 8px; color: var(--muted); font-size: 9pt; font-weight: 400; letter-spacing: .08em; text-align: center; }

    .shell { position: relative; z-index: 1; min-height: 0; overflow: visible; border: 1px solid var(--line); border-radius: 24px; background: var(--panel); display: flex; flex: 1 1 auto; flex-direction: column; }
    .toolbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px 22px; padding: 20px 24px 18px; border-bottom: 1px solid var(--line); }
    .period-label { display: flex; align-items: baseline; gap: 12px; min-width: 245px; }
    .period-label strong { font-size: 23px; letter-spacing: -.04em; white-space: nowrap; }
    .date-input-toggle { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; color: var(--muted); background: var(--panel-2); font: inherit; font-size: 11px; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
    .date-input-toggle:hover, .date-input-toggle[aria-expanded="true"] { color: var(--text); background: var(--panel); }
    .date-input { flex: 0 0 auto; width: 190px; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; color: var(--text); background: var(--panel-2); font: inherit; font-size: 13px; }
    .range-control { position: relative; display: flex; align-items: center; justify-content: center; justify-self: center; min-width: 0; }
    .range-control > span { position: absolute; right: calc(100% + 8px); top: 50%; color: var(--muted); font-size: 11px; white-space: nowrap; transform: translateY(-50%); }
    .range-switch { display: flex; flex: 0 0 auto; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
    .range-switch button { border: 0; border-radius: 9px; padding: 8px 11px; color: var(--muted); background: transparent; font: inherit; font-size: 12px; cursor: pointer; touch-action: manipulation; }
    .range-switch button[aria-pressed="true"] { color: var(--text); background: var(--panel); }
    .slider-wrap { grid-column: 1 / -1; grid-row: 2; display: flex; width: 100%; min-width: 0; align-items: center; gap: 13px; }
    .slider-wrap span { color: var(--muted); font-size: 12px; white-space: nowrap; }
    input[type="range"] { width: 100%; min-width: 0; height: 16px; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; accent-color: var(--accent); cursor: pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border: 0; border-radius: 999px; background: linear-gradient(90deg, var(--accent) 0 var(--slider-progress, 0%), var(--line) var(--slider-progress, 0%) 100%); }
    input[type="range"]::-webkit-slider-thumb { width: 12px; height: 12px; margin-top: -4px; border: 2px solid var(--panel); border-radius: 50%; background: var(--accent); box-shadow: none; appearance: none; -webkit-appearance: none; transition: transform .12s ease; }
    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.08); }
    input[type="range"]::-moz-range-track { height: 4px; border: 0; border-radius: 999px; background: var(--line); }
    input[type="range"]::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent); }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border: 2px solid var(--panel); border-radius: 50%; background: var(--accent); box-shadow: none; transition: transform .12s ease; }
    input[type="range"]:hover::-moz-range-thumb { transform: scale(1.08); }
    input[type="range"]:focus-visible { outline: 2px solid rgba(22, 140, 199, .24); outline-offset: 3px; border-radius: 999px; }
    .nudge-controls { grid-column: 3; grid-row: 1; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .nudge-group { display: flex; align-items: center; gap: 1px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .nudge-group button { width: 24px; height: 24px; border: 0; border-radius: 7px; color: var(--text); background: transparent; font: inherit; font-size: 13px; line-height: 1; cursor: pointer; touch-action: manipulation; }
    .nudge-group button:hover:not(:disabled) { background: var(--panel); }
    .nudge-group button:disabled { color: var(--muted); opacity: .38; cursor: default; }
    .nudge-group span { min-width: 34px; color: var(--muted); font-size: 11px; text-align: center; white-space: nowrap; }
    .autoplay-control { position: relative; z-index: 7; }
    .autoplay-button { border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; color: var(--muted); background: var(--panel-2); font: inherit; font-size: 11px; white-space: nowrap; cursor: pointer; touch-action: manipulation; }
    .autoplay-button:hover, .autoplay-button[aria-pressed="true"] { color: var(--text); background: var(--panel); }
    .autoplay-popover { position: absolute; z-index: 6; right: 0; bottom: calc(100% + 8px); display: grid; gap: 5px; min-width: 236px; padding: 6px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); box-shadow: 0 10px 24px rgba(23, 43, 64, .14); }
    .autoplay-popover[hidden] { display: none; }
    .autoplay-interval-row, .autoplay-speed-row { display: grid; align-items: center; gap: 3px; }
    .autoplay-interval-row { grid-template-columns: 44px repeat(4, minmax(0, 1fr)); }
    .autoplay-speed-row { grid-template-columns: 44px repeat(4, minmax(0, 1fr)); }
    .autoplay-interval-row span, .autoplay-speed-row span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .autoplay-interval-row button, .autoplay-speed-row button { min-width: 0; border: 0; border-radius: 7px; padding: 5px 3px; color: var(--muted); background: var(--panel-2); font: inherit; font-size: 10px; cursor: pointer; touch-action: manipulation; }
    .autoplay-interval-row button:hover:not(:disabled), .autoplay-interval-row button[aria-pressed="true"], .autoplay-speed-row button:hover:not(:disabled), .autoplay-speed-row button[aria-pressed="true"] { color: var(--text); background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent); }
    .autoplay-interval-row button:disabled, .autoplay-speed-row button:disabled { color: var(--muted); opacity: .38; cursor: default; }
    .chart-wrap { position: relative; min-height: 0; padding: 12px 18px 18px; display: flex; flex: 1 1 auto; flex-direction: column; align-items: center; justify-content: center; }
    .chart-note { width: min(100%, 760px); margin: 0 0 2px; color: var(--muted); font-size: 12px; text-align: right; }
    svg { display: block; width: min(100%, 760px); height: min(100%, 760px); max-width: 100%; max-height: 100%; aspect-ratio: 1 / 1; margin: 0 auto; }
    .grid-line { stroke: rgba(34, 70, 103, .08); stroke-width: 1; }
    .bubble { cursor: default; transition: opacity .15s ease; }
    .bubble circle { stroke: rgba(255, 255, 255, .7); stroke-width: 1.5; }
    .bubble text { fill: #173049; font-weight: 800; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
    .empty-note { fill: var(--muted); font-size: 14px; text-anchor: middle; }
    .tooltip { position: absolute; z-index: 4; pointer-events: none; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--text); opacity: 0; transform: translate(12px, 12px); transition: opacity .15s ease; box-shadow: 0 8px 18px rgba(23, 43, 64, .12); }
    .tooltip strong { display: block; margin-bottom: 2px; font-size: 12px; }
    .tooltip span { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: auto 1fr; }
      .nudge-controls { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
      .slider-wrap { grid-column: 1 / -1; grid-row: 3; }
    }
    @media (max-width: 760px) {
      .app { width: min(100% - 20px, 640px); }
      .intro { display: block; }
      .source { display: block; margin-top: 12px; }
      .toolbar { display: block; padding: 16px; }
      .range-control { flex-direction: column; gap: 4px; margin-top: 14px; }
      .range-control > span { position: static; transform: none; }
      .range-switch { margin-top: 0; }
      .slider-wrap { margin-top: 16px; }
      .nudge-controls { margin-top: 10px; column-gap: 4px; row-gap: 6px; }
      .autoplay-popover { left: 0; right: auto; width: min(236px, calc(100vw - 32px)); min-width: 0; }
      .chart-wrap { padding: 8px 8px 14px; }
      .chart-note { width: 100%; padding-right: 4px; }
      svg { width: 100%; height: auto; min-height: 0; }
    }
    @media (max-width: 340px) {
      .nudge-controls { column-gap: 0; }
      .nudge-group { gap: 0; padding: 2px; }
      .nudge-group button { width: 20px; height: 24px; font-size: 11px; }
      .nudge-group span { min-width: 34px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="intro">
      <div>
        <p class="eyebrow">Everytime · daily keyword</p>
        <h1>연세 에브리타임 자유게시판 키워드</h1>
      </div>
    </section>

    <section class="shell" aria-label="일별 키워드 버블 차트">
      <div class="toolbar">
        <div class="period-label">
          <strong id="periodName">2024.01.01 — 2024.01.30</strong>
          <input class="date-input" id="dateInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10" placeholder="YYYY.MM.DD" aria-label="타임포인트 날짜 (년.월.일)" hidden>
          <button type="button" class="date-input-toggle" id="dateInputToggle" aria-expanded="false">날짜 입력</button>
        </div>
        <div class="range-control">
          <span>시간 범위</span>
          <div class="range-switch" role="group" aria-label="집계 범위">
            <button type="button" data-range="7" aria-pressed="false">1주일</button>
            <button type="button" data-range="30" aria-pressed="true">1개월</button>
            <button type="button" data-range="90" aria-pressed="false">3개월</button>
          </div>
        </div>
        <div class="nudge-controls" role="group" aria-label="타임포인트 이동 단위">
          <div class="nudge-group" role="group" aria-label="1일 단위 이동">
            <button type="button" data-nudge="-1" aria-label="1일 이전">◀</button>
            <span>1일</span>
            <button type="button" data-nudge="1" aria-label="1일 다음">▶</button>
          </div>
          <div class="nudge-group" role="group" aria-label="일주일 단위 이동">
            <button type="button" data-nudge="-7" aria-label="일주일 이전">◀</button>
            <span>1주일</span>
            <button type="button" data-nudge="7" aria-label="일주일 다음">▶</button>
          </div>
          <div class="nudge-group" role="group" aria-label="1달 단위 이동">
            <button type="button" data-nudge="-30" aria-label="1달 이전">◀</button>
            <span>1달</span>
            <button type="button" data-nudge="30" aria-label="1달 다음">▶</button>
          </div>
          <div class="autoplay-control" id="autoplayControl">
            <div class="autoplay-popover" id="autoplayPopover" role="group" aria-label="자동 재생 간격, 방향 및 속도" hidden>
              <div class="autoplay-interval-row" role="group" aria-label="자동 재생 이동 간격">
                <span>간격</span>
                <button type="button" data-autoplay-days="1" aria-pressed="false">1일</button>
                <button type="button" data-autoplay-days="7" aria-pressed="false">1주일</button>
                <button type="button" data-autoplay-days="14" aria-pressed="true">2주일</button>
                <button type="button" data-autoplay-days="30" aria-pressed="false">1달</button>
              </div>
              <div class="autoplay-speed-row" role="group" aria-label="순방향 재생 속도">
                <span>순방향</span>
                <button type="button" data-autoplay-direction="1" data-autoplay-interval="1200" aria-pressed="false" aria-label="순방향 1배속">1×</button>
                <button type="button" data-autoplay-direction="1" data-autoplay-interval="800" aria-pressed="false" aria-label="순방향 2배속">2×</button>
                <button type="button" data-autoplay-direction="1" data-autoplay-interval="600" aria-pressed="false" aria-label="순방향 4배속">4×</button>
                <button type="button" data-autoplay-direction="1" data-autoplay-interval="400" aria-pressed="false" aria-label="순방향 8배속">8×</button>
              </div>
              <div class="autoplay-speed-row" role="group" aria-label="역방향 재생 속도">
                <span>역방향</span>
                <button type="button" data-autoplay-direction="-1" data-autoplay-interval="1200" aria-pressed="false" aria-label="역방향 1배속">1×</button>
                <button type="button" data-autoplay-direction="-1" data-autoplay-interval="800" aria-pressed="false" aria-label="역방향 2배속">2×</button>
                <button type="button" data-autoplay-direction="-1" data-autoplay-interval="600" aria-pressed="false" aria-label="역방향 4배속">4×</button>
                <button type="button" data-autoplay-direction="-1" data-autoplay-interval="400" aria-pressed="false" aria-label="역방향 8배속">8×</button>
              </div>
            </div>
            <button type="button" class="autoplay-button" id="autoplayButton" aria-expanded="false" aria-controls="autoplayPopover" aria-pressed="false">자동 재생</button>
          </div>
        </div>
        <label class="slider-wrap" for="dateSlider">
          <span id="sliderStart">2024.01.01</span>
          <input id="dateSlider" type="range" min="0" max="932" value="0" step="1" aria-label="일별 타임포인트 이동">
          <span id="sliderEnd">2026.07.21</span>
        </label>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg id="bubbleChart" role="img" aria-labelledby="chartTitle chartDescription" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet">
          <title id="chartTitle">일별 키워드 빈도 버블 차트</title>
          <desc id="chartDescription">기간 내 키워드 누적 등장 횟수를 버블 크기로 나타냅니다. 슬라이더의 각 타임포인트 간격은 1일입니다.</desc>
          <g id="grid"></g>
          <g id="bubbles"></g>
          <text id="emptyNote" class="empty-note" x="350" y="350" opacity="0">표시할 키워드가 없습니다.</text>
        </svg>
        <div class="tooltip" id="tooltip"><strong></strong><span></span></div>
      </div>
    </section>
    <footer class="footnote">만든이: QRM25 박규혁</footer>
  </main>

      node.label = label;
      nodeStates.set(word, node);
      group.addEventListener("pointerenter", event => {
        if (!node.item) return;
        tooltipTitle.textContent = node.item.word;
        tooltipValue.textContent = `순위 ${node.item.rank}위`;
        const rect = chartWrap.getBoundingClientRect();
        tooltip.style.left = `${event.clientX - rect.left}px`;
        tooltip.style.top = `${event.clientY - rect.top}px`;
        tooltip.style.opacity = "1";
      });
      group.addEventListener("pointermove", event => {
        const rect = chartWrap.getBoundingClientRect();
        tooltip.style.left = `${event.clientX - rect.left}px`;
        tooltip.style.top = `${event.clientY - rect.top}px`;
      });
      group.addEventListener("pointerleave", () => { tooltip.style.opacity = "0"; });
      return node;
    }

    function resolveCollisions(frameNodes, immediate = false) {
      const active = frameNodes.filter(node => node.targetRadius > 0.5 || node.radius > 0.5);
      for (let pass = 0; pass < (immediate ? 8 : 5); pass += 1) {
        for (let firstIndex = 0; firstIndex < active.length; firstIndex += 1) {
          for (let secondIndex = firstIndex + 1; secondIndex < active.length; secondIndex += 1) {
            const first = active[firstIndex];
            const second = active[secondIndex];
            let dx = second.x - first.x;
            let dy = second.y - first.y;
            let distance = Math.hypot(dx, dy);
            if (distance < 0.01) {
              const angle = (hashWord(first.word + second.word) % 360) * Math.PI / 180;
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }
            const minimum = first.radius + second.radius + 12;
            if (distance < minimum) {
              const push = (minimum - distance) * (immediate ? 0.5 : 0.10);
              const nx = dx / distance;
              const ny = dy / distance;
              if (immediate) {
                first.x -= nx * push;
                first.y -= ny * push;
                second.x += nx * push;
                second.y += ny * push;
              } else {
                const correction = (minimum - distance) * 0.09;
                first.x -= nx * correction;
                first.y -= ny * correction;
                second.x += nx * correction;
                second.y += ny * correction;
                const relativeVelocity = (second.vx - first.vx) * nx + (second.vy - first.vy) * ny;
                if (relativeVelocity < 0) {
                  const impulse = -relativeVelocity * 0.24;
                  first.vx -= nx * impulse;
                  first.vy -= ny * impulse;
                  second.vx += nx * impulse;
                  second.vy += ny * impulse;
                }
              }
            }
          }
        }
        active.forEach(node => {
          const minX = 30 + node.radius;
          const maxX = 670 - node.radius;
          const minY = 54 + node.radius;
          const maxY = 670 - node.radius;
          if (node.x < minX) { node.x = minX; if (!immediate && node.vx < 0) node.vx = 0; }
          if (node.x > maxX) { node.x = maxX; if (!immediate && node.vx > 0) node.vx = 0; }
          if (node.y < minY) { node.y = minY; if (!immediate && node.vy < 0) node.vy = 0; }
          if (node.y > maxY) { node.y = maxY; if (!immediate && node.vy > 0) node.vy = 0; }
        });
      }
    }

    let animationId = 0;
    function render(animate = true) {
      const windowData = getWindow(state.index, state.days);
      const values = new Map(windowData.words.map(item => [item.word, item]));
      const scale = scaleFor(windowData.words);
      const startTime = performance.now();
      const duration = animate
        ? (autoplayDirection ? Math.min(875, Math.max(180, autoplayInterval * 0.78)) : 875)
        : 0;
      const currentAnimation = ++animationId;
      const nextNodes = new Set();
      values.forEach((item, word) => {
        const node = ensureNode(word);
        const anchor = positionFor(word);
        const established = visibleNodes.has(node) && node.radius > 0.1;
        const target = established
          ? { x: node.x + (anchor.x - node.x) * 0.22, y: node.y + (anchor.y - node.y) * 0.22 }
          : anchor;
        node.item = item;
        node.group.dataset.active = String(Boolean(item));
        node.startX = Number.isFinite(node.x) ? node.x : target.x;
        node.startY = Number.isFinite(node.y) ? node.y : target.y;
        node.startRadius = node.radius || 0;
        node.vx *= 0.55;
        node.vy *= 0.55;
        node.targetX = target.x;
        node.targetY = target.y;
        node.targetRadius = radiusFor(item?.total || 0, scale);
        nextNodes.add(node);
      });
      visibleNodes.forEach(node => {
        if (nextNodes.has(node)) return;
        node.item = null;
        node.group.dataset.active = "false";
        node.startX = node.x;
        node.startY = node.y;
        node.startRadius = node.radius;
        node.vx *= 0.55;
        node.vy *= 0.55;
        node.targetX = positionFor(node.word).x;
        node.targetY = positionFor(node.word).y;
        node.targetRadius = 0;
        nextNodes.add(node);
      });
      visibleNodes = nextNodes;

      function removeFinishedNode(node) {
        if (node.targetRadius > 0 || node.radius > 0.1 || !node.group) return;
        node.group.remove();
        node.group = null;
        node.circle = null;
        node.label = null;
        node.item = null;
        visibleNodes.delete(node);
      }

      function frame(now) {
        if (currentAnimation !== animationId) return;
        const progress = duration ? Math.min(1, (now - startTime) / duration) : 1;
        const eased = 1 - Math.pow(1 - progress, 2.7);
        const frameNodes = [...visibleNodes];
        frameNodes.forEach(node => {
          const desiredX = node.startX + (node.targetX - node.startX) * eased;
          const desiredY = node.startY + (node.targetY - node.startY) * eased;
          node.vx += (desiredX - node.x) * 0.085;
          node.vy += (desiredY - node.y) * 0.085;
          node.vx *= 0.76;
          node.vy *= 0.76;
          node.x += node.vx;
          node.y += node.vy;
          node.radius = node.startRadius + (node.targetRadius - node.startRadius) * eased;
          node.group.style.opacity = node.radius > 0.1 ? "1" : "0";
          node.group.style.pointerEvents = node.radius > 0.5 ? "auto" : "none";
          node.label.style.opacity = node.radius > 9 ? "1" : "0";
        });
        resolveCollisions(frameNodes, !animate);
        frameNodes.forEach(node => {
          if (Math.abs(node.vx) < 0.02) node.vx = 0;
          if (Math.abs(node.vy) < 0.02) node.vy = 0;
        });
        frameNodes.forEach(node => {
          node.circle.setAttribute("cx", node.x.toFixed(2));
          node.circle.setAttribute("cy", node.y.toFixed(2));
          node.circle.setAttribute("r", node.radius.toFixed(2));
          node.label.setAttribute("x", node.x.toFixed(2));
          node.label.setAttribute("y", node.y.toFixed(2));
          node.label.setAttribute("font-size", labelSize(node.word, node.radius).toFixed(1));
        });
        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          frameNodes.forEach(removeFinishedNode);
        }
      }
      requestAnimationFrame(frame);
    }

    let renderQueueId = 0;
    function queueRender(animate = true) {
      if (renderQueueId) cancelAnimationFrame(renderQueueId);
      renderQueueId = requestAnimationFrame(() => {
        renderQueueId = 0;
        render(animate);
      });
    }

    function syncControls(animate = true) {
      if (renderQueueId) {
        cancelAnimationFrame(renderQueueId);
        renderQueueId = 0;
      }
      const maxStart = dataset.days.length - state.days;
      state.index = Math.max(0, Math.min(maxStart, state.index));
      slider.max = String(maxStart);
      slider.value = String(state.index);
      updateSliderVisual();
      const windowData = getWindow(state.index, state.days);
      periodName.textContent = `${formatDate(windowData.start.d)} — ${formatDate(windowData.end.d)}`;
      dateInput.dataset.min = dataset.days[0].d;
      dateInput.dataset.max = dataset.days[maxStart].d;
      dateInput.value = formatDate(dataset.days[state.index].d);
      sliderStart.textContent = formatDate(dataset.days[0].d);
      sliderEnd.textContent = formatDate(dataset.days[maxStart].d);
      slider.setAttribute("aria-valuetext", `${formatDate(windowData.start.d)}부터 ${formatDate(windowData.end.d)}`);
      updateNudgeButtons();
      updateAutoplayUI();
      render(animate);
    }

    function updateNudgeButtons() {
      const maxStart = dataset.days.length - state.days;
      nudgeButtons.forEach(button => {
        const nextIndex = state.index + Number(button.dataset.nudge);
        button.disabled = nextIndex < 0 || nextIndex > maxStart;
      });
      autoplaySpeedButtons.forEach(button => {
        const nextIndex = state.index + Number(button.dataset.autoplayDirection) * autoplayDays;
        button.disabled = nextIndex < 0 || nextIndex > maxStart;
      });
    }

    function updateAutoplayUI() {
      const playing = autoplayDirection !== 0;
      autoplayButton.textContent = playing ? "정지" : "자동 재생";
      autoplayButton.setAttribute("aria-label", playing ? "자동 재생 정지" : "자동 재생 설정");
      autoplayButton.setAttribute("aria-pressed", String(playing));
      autoplayIntervalButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.autoplayDays) === autoplayDays));
      });
      autoplaySpeedButtons.forEach(button => {
        const active = playing
          && Number(button.dataset.autoplayDirection) === autoplayDirection
          && Number(button.dataset.autoplayInterval) === autoplayInterval;
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function setAutoplayDays(days) {
      autoplayDays = Number(days);
      updateNudgeButtons();
      updateAutoplayUI();
      if (autoplayDirection) {
        if (autoplayTimer) {
          clearTimeout(autoplayTimer);
          autoplayTimer = 0;
        }
        scheduleAutoplay();
      }
    }

    function openAutoplayPopover() {
      autoplayPopover.hidden = false;
      autoplayButton.setAttribute("aria-expanded", "true");
    }

    function closeAutoplayPopover() {
      autoplayPopover.hidden = true;
      autoplayButton.setAttribute("aria-expanded", "false");
    }

    function stopAutoplay() {
      if (autoplayTimer) {
        clearTimeout(autoplayTimer);
        autoplayTimer = 0;
      }
      autoplayDirection = 0;
      autoplayInterval = 1200;
      updateAutoplayUI();
    }

    function autoplayStep() {
      const maxStart = dataset.days.length - state.days;
      const nextIndex = state.index + autoplayDirection * autoplayDays;
      if (!autoplayDirection || nextIndex < 0 || nextIndex > maxStart) {
        stopAutoplay();
        updateNudgeButtons();
        return;
      }
      state.index = nextIndex;
      syncControls(true);
    }

    function scheduleAutoplay() {
      if (!autoplayDirection) return;
      autoplayTimer = window.setTimeout(() => {
        autoplayTimer = 0;
        autoplayStep();
        if (autoplayDirection) scheduleAutoplay();
      }, autoplayInterval);
    }

    function startAutoplay(direction, interval) {
      const wasPlaying = autoplayDirection !== 0;
      const sameDirection = wasPlaying && autoplayDirection === direction;
      stopAutoplay();
      autoplayDirection = direction;
      autoplayInterval = Number(interval);
      openAutoplayPopover();
      updateAutoplayUI();
      if (!sameDirection) autoplayStep();
      if (autoplayDirection) scheduleAutoplay();
    }

    rangeButtons.forEach(button => {
      button.addEventListener("click", () => {
        stopAutoplay();
        closeAutoplayPopover();
        closeDateInput();
        const previousEndDate = state.index + state.days - 1;
        state.days = Number(button.dataset.range);
        state.index = Math.max(0, previousEndDate - state.days + 1);
        rangeButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        syncControls(true);
      });
    });

    nudgeButtons.forEach(button => {
      button.addEventListener("click", () => {
        stopAutoplay();
        closeAutoplayPopover();
        closeDateInput();
        state.index += Number(button.dataset.nudge);
        syncControls(true);
      });
    });

    slider.addEventListener("input", () => {
      stopAutoplay();
      closeAutoplayPopover();
      closeDateInput();
      state.index = Number(slider.value);
      const windowData = getWindow(state.index, state.days);
      periodName.textContent = `${formatDate(windowData.start.d)} — ${formatDate(windowData.end.d)}`;
      slider.setAttribute("aria-valuetext", `${formatDate(windowData.start.d)}부터 ${formatDate(windowData.end.d)}`);
      updateSliderVisual();
      updateNudgeButtons();
      queueRender(true);
    });

    dateInputToggle.addEventListener("click", () => {
      if (!dateInput.hidden) {
        applyDateInput();
        return;
      }
      stopAutoplay();
      closeAutoplayPopover();
      const bounds = dateBounds();
      dateInput.dataset.min = bounds.min;
      dateInput.dataset.max = bounds.max;
      dateInput.value = formatDate(dataset.days[state.index].d);
      periodName.hidden = true;
      dateInput.hidden = false;
      dateInputToggle.textContent = "적용";
      dateInputToggle.setAttribute("aria-expanded", "true");
      dateInput.focus();
    });

    dateInput.addEventListener("change", applyDateInput);
    dateInput.addEventListener("input", () => dateInput.setCustomValidity(""));
    dateInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyDateInput();
      } else if (event.key === "Escape") {
        closeDateInput();
      }
    });

    document.addEventListener("keydown", event => {
      const activeElement = document.activeElement;
      const editingElement = activeElement?.matches("input, textarea, select, [contenteditable=\"true\"]");
      if (editingElement || event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      stopAutoplay();
      closeAutoplayPopover();
      closeDateInput();
      state.index += event.key === "ArrowLeft" ? -7 : 7;
      syncControls(true);
    });

    autoplayButton.addEventListener("click", () => {
      closeDateInput();
      if (autoplayDirection) {
        stopAutoplay();
        closeAutoplayPopover();
        updateNudgeButtons();
        return;
      }
      if (autoplayPopover.hidden) openAutoplayPopover();
      else closeAutoplayPopover();
    });

    autoplayIntervalButtons.forEach(button => {
      button.addEventListener("click", () => {
        setAutoplayDays(button.dataset.autoplayDays);
      });
    });

    autoplaySpeedButtons.forEach(button => {
      button.addEventListener("click", () => {
        startAutoplay(Number(button.dataset.autoplayDirection), Number(button.dataset.autoplayInterval));
      });
    });

    document.addEventListener("pointerdown", event => {
      if (!autoplayControl.contains(event.target)) closeAutoplayPopover();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeAutoplayPopover();
    });

    syncControls(false);
  </script>
</body>
</html>
